name: Dependabot – Regenerar bun.lock

on:
  pull_request:
    branches: [develop]
    paths:
      - package.json

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerar bun.lock
        run: bun install

      - name: Commitear bun.lock actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate bun.lock after Dependabot bump"
          file_pattern: bun.lock
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
