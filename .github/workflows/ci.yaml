name: CI - Verificación de Código

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias
        run: bun install

      - name: Lint (Calidad de código)
        run: bun run lint

      - name: Run Jest tests
        run: bun run test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build con Análisis de Bundle
        run: bun run build
        env:
          ANALYZE: true
          NEXT_TELEMETRY_DISABLED: 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install

      - run: bun run build

      - name: Run Lighthouse
        run: |
          bun add -g @lhci/cli@0.13.x
          lhci autorun
